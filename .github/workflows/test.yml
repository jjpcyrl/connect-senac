name: 🚀 CI/CD Test & Quality Pipeline

on:
  push:
    branches: [ main, master-dev, master-dev-two ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: 🧪 Automated Security & Integration Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛡️ Run Security & Regression Test Suites
        env:
          NODE_ENV: test
          JWT_SECRET: github_actions_ci_pipeline_jwt_secret_token_123
        run: npm test