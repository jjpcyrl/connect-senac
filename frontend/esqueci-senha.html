<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Senac - Recuperar Senha</title>
    
    <!-- Bootstrap 5.3 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Connect Senac Design System Theme -->
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5" style="background-color: var(--bg-app);">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
                <div class="card card-custom p-4 p-md-5 border-0 shadow-lg" style="border-radius: var(--radius-xl);">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle mb-3" style="background-color: var(--senac-blue-light); color: var(--senac-blue); width: 64px; height: 64px;">
                            <i class="bi bi-key-fill fs-2"></i>
                        </div>
                        <h3 class="fw-bold mb-2" style="color: var(--senac-blue);">Recuperar Senha</h3>
                        <p class="text-muted small mb-0">
                            Insira seu e-mail cadastrado para receber as instruções de recuperação de acesso.
                        </p>
                    </div>

                    <form id="formEsqueci">
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="emailRecuperacao" placeholder="nome@exemplo.com" required autocomplete="email">
                            <label for="emailRecuperacao"><i class="bi bi-envelope me-1"></i> Seu E-mail</label>
                        </div>

                        <div id="msgRecuperacao" class="small text-center mb-3 fw-bold"></div>

                        <button type="submit" class="btn btn-brand w-100 py-3 mb-3" id="btnEnviarRecuperacao">
                            <span>Enviar Link de Recuperação</span>
                            <i class="bi bi-send-fill ms-1"></i>
                        </button>

                        <a href="index.html" class="btn btn-subtle w-100 py-2 text-center d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-arrow-left"></i>
                            <span>Voltar ao Login</span>
                        </a>
                    </form>
                </div>
                
                <div class="text-center mt-4">
                    <p class="small text-muted mb-0">Connect Senac • Suporte Acadêmico</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
